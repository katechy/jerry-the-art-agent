name: RSS Checker

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Só testar os feeds (não envia nada ao Discord)'
        type: boolean
        default: false

permissions:
  contents: write   # necessário para salvar o last_posted.json no repositório

concurrency:
  group: rss-checker
  cancel-in-progress: false

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar verificador RSS
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_URL_3D: ${{ secrets.WEBHOOK_URL_3D }}
          ROLE_ID: ${{ vars.ROLE_ID }}
        run: |
          if [ "${{ inputs.modo_teste }}" = "true" ]; then
            python rss_checker.py --check
          else
            python rss_checker.py
          fi

      - name: Salvar estado (commit do last_posted.json)
        if: ${{ inputs.modo_teste != true }}
        run: |
          git config user.name "jerry-bot"
          git config user.email "jerry-bot@users.noreply.github.com"
          git add last_posted.json
          git diff --cached --quiet || git commit -m "Atualiza posts já enviados [skip ci]"
          git push
